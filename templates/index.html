<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1F2937;
        }
        
        .container {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            border: 1px solid #FECACA;
        }
        
        .header {
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            color: #FFFFFF;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
            font-weight: 400;
        }
        
        .content {
            padding: 30px;
        }
        
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .feature {
            text-align: center;
            padding: 16px 12px;
            background: #FEF2F2;
            border-radius: 8px;
            border: 1px solid #FECACA;
            transition: all 0.3s ease;
        }
        
        .feature:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
        }
        
        .feature i {
            font-size: 20px;
            color: #DC2626;
            margin-bottom: 8px;
        }
        
        .feature span {
            font-size: 11px;
            font-weight: 500;
            color: #374151;
        }
        
        .start-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
        }
        
        .data-info {
            padding: 16px;
            background: #FEF2F2;
            border-radius: 8px;
            border-left: 4px solid #DC2626;
            font-size: 13px;
        }
        
        .data-info h3 {
            color: #DC2626;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .data-info ul {
            list-style: none;
            color: #4B5563;
        }
        
        .data-info li {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .data-info li:before {
            content: "•";
            color: #DC2626;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> Fraud Detection AI</h1>
            <p>Real-time Financial Transaction Monitoring</p>
        </div>
        
        <div class="content">
            <div class="features">
                <div class="feature">
                    <i class="fas fa-search"></i>
                    <span>Real-time Monitoring</span>
                </div>
                <div class="feature">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Fraud Patterns</span>
                </div>
                <div class="feature">
                    <i class="fas fa-bell"></i>
                    <span>Auto Alerts</span>
                </div>
                <div class="feature">
                    <i class="fas fa-ban"></i>
                    <span>Block Suspicious</span>
                </div>
            </div>
            
            <button class="start-btn" onclick="enterDashboard()">
                <i class="fas fa-play"></i> Launch Dashboard
            </button>
            
            <div class="data-info">
                <h3><i class="fas fa-database"></i> Monitoring</h3>
                <ul>
                    <li>Transaction Amounts</li>
                    <li>Vendor Patterns</li>
                    <li>Employee Behavior</li>
                    <li>Time Analysis</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        function enterDashboard() {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
